<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除浏览器缓存 - JOY IP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            color: #555;
            line-height: 1.6;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f4ff;
            color: #667eea;
        }
        
        .btn-secondary:hover {
            background: #e0e8ff;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.show {
            display: block;
        }
        
        .details {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
            line-height: 1.8;
        }
        
        .details strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 清除浏览器缓存</h1>
        
        <div class="info">
            <strong>为什么需要清除缓存？</strong><br>
            如果页面一直处于加载状态或出现异常，可能是浏览器缓存数据损坏导致的。清除缓存可以解决大部分加载问题。
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="clearAllStorage()">
                清除所有缓存并刷新
            </button>
            <button class="btn-secondary" onclick="clearChatOnly()">
                仅清除聊天记录
            </button>
            <button class="btn-secondary" onclick="goBack()">
                返回首页
            </button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="details">
            <strong>清除内容包括：</strong><br>
            • 聊天历史记录<br>
            • 用户输入状态<br>
            • 预设选项<br>
            • 滚动位置<br>
            • 公告已读状态
        </div>
    </div>
    
    <script>
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type} show`;
        }
        
        function clearAllStorage() {
            try {
                // 清除 localStorage
                const itemsCleared = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key) itemsCleared.push(key);
                }
                localStorage.clear();
                
                // 清除 sessionStorage
                sessionStorage.clear();
                
                showStatus(`✅ 成功清除 ${itemsCleared.length} 项缓存数据，即将刷新页面...`, 'success');
                
                // 2秒后跳转到首页
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                showStatus(`❌ 清除失败: ${error.message}`, 'error');
            }
        }
        
        function clearChatOnly() {
            try {
                const chatKey = 'joy_ip_chat_state';
                const hadData = localStorage.getItem(chatKey) !== null;
                
                localStorage.removeItem(chatKey);
                sessionStorage.removeItem('pending_detail_image');
                
                if (hadData) {
                    showStatus('✅ 聊天记录已清除，即将返回首页...', 'success');
                } else {
                    showStatus('ℹ️ 没有找到聊天记录，即将返回首页...', 'success');
                }
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                showStatus(`❌ 清除失败: ${error.message}`, 'error');
            }
        }
        
        function goBack() {
            window.location.href = '/';
        }
        
        // 页面加载时显示当前缓存信息
        window.addEventListener('load', () => {
            console.log('当前 localStorage 内容:');
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) {
                    const value = localStorage.getItem(key);
                    console.log(`${key}:`, value ? value.substring(0, 100) + '...' : 'null');
                }
            }
        });
    </script>
</body>
</html>
